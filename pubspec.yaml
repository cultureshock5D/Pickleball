name: pickleball_app
description: "A luxury dark-themed Flutter application integrated with Supabase Auth and Postgres profiles."
publish_to: "none"
version: 0.3.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  intl: ^0.19.0
  http: ^1.2.0
  connectivity_plus: ^5.0.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
