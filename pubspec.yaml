name: pickleball_app
description: "A luxury dark-themed Flutter application integrated with Supabase Auth and Postgres profiles."
publish_to: "none"
version: 2.8.0+18

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  intl: ^0.19.0
  http: ^1.2.0
  connectivity_plus: ^6.1.0
  cached_network_image: ^3.4.1
  internet_connection_checker_plus: ^3.1.2
  sqflite: ^2.4.4
  sqflite_common_ffi: ^2.4.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - cashier_pos/
    - cashier_pos/coffee/
